services:
  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - mcp-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp
volumes:
  mcp-data:
  caddy-data:
  caddy-config:
